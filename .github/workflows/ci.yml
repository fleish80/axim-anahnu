name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    outputs:
      can-deploy: ${{ steps.deploy-secret.outputs.present }}
    steps:
      # Secrets can't be used in a job's `if`, so record here whether the deploy secret exists.
      # Until it is created, the deploy jobs are skipped instead of failing.
      - id: deploy-secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AXIM_ANAHNU }}
        run: echo "present=${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/axim-anahnu/browser
          retention-days: 7

  preview:
    name: Deploy preview channel
    # Only for pull requests from this repository, once the deploy secret exists.
    if: >-
      needs.check.outputs.can-deploy == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/axim-anahnu/browser
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AXIM_ANAHNU }}
          projectId: axim-anahnu
          expires: 7d

  live:
    name: Deploy live site
    if: needs.check.outputs.can-deploy == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/axim-anahnu/browser
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AXIM_ANAHNU }}
          projectId: axim-anahnu
          channelId: live
